apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "concur_db"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concur-res-deployment
spec:
  replicas: 2 # Теперь можно запускать ХОТЬ 2, ХОТЬ 5 подов! База всё синхронизирует.
  selector:
    matchLabels:
      app: concur-res
  template:
    metadata:
      labels:
        app: concur-res
    spec:
      containers:
      - name: concur-res-container
        image: concur-res-app:v1
        imagePullPolicy: Never # Важно для Minikube, чтобы не лезть в интернет
        ports:
        - containerPort: 8080
        env:
        # Указываем путь к нашей K8s-базе данных postgres-service
        - name: DATABASE_URL
          value: "postgres://postgres:password@postgres-service:5432/concur_db?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: concur-res-lb
spec:
  type: NodePort
  selector:
    app: concur-res
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
